name: ${COMPOSE_PROJECT_NAME:-stick-it}

x-logging: &logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '3'

services:
  web:
    image: ${WEB_IMAGE:-stick-it-web:2.3.0}
    environment:
      TRUSTED_HOST_PROXY: ${TRUSTED_HOST_PROXY:-}
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 64m
    pids_limit: 32
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  api:
    image: ${API_IMAGE:-stick-it-api:2.3.0}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8080}
      TRUST_PROXY: one
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-720}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      NODE_OPTIONS: --max-old-space-size=160
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-5000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-10000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "const r = await fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(3000) }); if (!r.ok || (await r.json()).status !== 'ok') process.exit(1);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - autovacuum_work_mem=16MB
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_worker_processes=2
      - -c
      - jit=off
      - -c
      - wal_buffers=4MB
      - -c
      - min_wal_size=80MB
      - -c
      - max_wal_size=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    shm_size: 64m
    mem_limit: 320m
    pids_limit: 64
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-stickit_postgres}
  uploads:
    name: ${UPLOADS_VOLUME_NAME:-stickit_uploads}
