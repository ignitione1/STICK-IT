worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_body_timeout 30s;
  client_max_body_size 26m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Re-resolve api after container recreation, without restarting Nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    server_name _;
    root /srv/stickerboard;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok\n';
    }

    location = /api {
      return 308 /api/;
    }

    location ^~ /api/ {
      set $api_origin http://api:3000;
      # No URI suffix: preserve /api/ and the original query string.
      proxy_pass $api_origin;
      proxy_http_version 1.1;
      # Stream uploads to the API instead of filling the 16 MiB nginx tmpfs.
      proxy_request_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 3600s;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
    }

    location = /index.html {
      expires -1;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1h;
    }

    location ~ /\. {
      deny all;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
