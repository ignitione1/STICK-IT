name: Проверка и сборка образов

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Восстановить кэш npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: stick-it-npm-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'server/package-lock.json') }}
          restore-keys: stick-it-npm-v1-${{ runner.os }}-
      - name: Установить зависимости
        run: |
          npm ci
          npm --prefix server ci
      - name: Собрать интерфейс
        run: npm run build
      - name: Проверить сервер
        run: |
          npm --prefix server run typecheck
          npm --prefix server test
          python3 -m unittest discover -s deploy/tests -v
          sh deploy/tests/test-prune-images.sh
          sh deploy/tests/test-pull-image.sh
      - uses: docker/setup-buildx-action@v4
      - name: Собрать контейнеры для проверки
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          docker buildx build --load --target runtime -t stick-it-api:${GITHUB_SHA} -f server/Dockerfile server
          docker buildx build --load -t stick-it-web:${GITHUB_SHA} -f deploy/web.Dockerfile .
      - name: Собрать и опубликовать образы в GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image_prefix="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Fixed file timestamps let Docker reuse identical layers across releases.
          docker buildx build --build-arg SOURCE_DATE_EPOCH=0 --target runtime \
            --output "type=image,name=${image_prefix}-api:${GITHUB_SHA},push=true,rewrite-timestamp=true" \
            -f server/Dockerfile server
          docker buildx build --build-arg SOURCE_DATE_EPOCH=0 \
            --output "type=image,name=${image_prefix}-web:${GITHUB_SHA},push=true,rewrite-timestamp=true" \
            -f deploy/web.Dockerfile .
