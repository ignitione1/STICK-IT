name: Ручной деплой на VPS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stickit-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Проверить сборку последней версии и запустить деплой
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -eu
          RELEASE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo 'Неверный SHA последнего коммита'; exit 1; }
          builds=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/images.yml/runs" \
            -f branch=main -f head_sha="$RELEASE_SHA" -f status=success -f per_page=100 \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | length')
          [ "$builds" -gt 0 ] || { echo 'Для последнего коммита main пока нет успешной сборки образов'; exit 1; }
          echo "Деплой версии $RELEASE_SHA"
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST_KEY"
          printf '%s' "$DEPLOY_HOST" | grep -Eq '^[a-zA-Z0-9.-]+$' || { echo 'Неверный адрес VPS'; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/stickit_deploy"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/stickit_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$DEPLOY_HOST" "$RELEASE_SHA"
